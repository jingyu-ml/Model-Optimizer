# Qwen-Image QAD with a regular ModelOpt NVFP4 student.
#
# model.pretrained_model_name_or_path must be a complete ModelOpt-aware
# Diffusers training bundle produced by quantize.py --output-bundle.

seed: 42

wandb:
  project: fastgen-qad-qwen-image
  mode: online
  name: qwen_image_qad_nvfp4

dist_env:
  backend: nccl
  timeout_minutes: 60

model:
  # Complete calibrated NVFP4 bundle; AutoModel records this field in checkpoints.
  pretrained_model_name_or_path: /path/to/qwen-image-nvfp4-training-bundle
  mode: finetune

step_scheduler:
  global_batch_size: 64
  local_batch_size: 1
  ckpt_every_steps: 1000
  num_epochs: 200
  log_every: 1
  max_steps: 50000

qad:
  # QAD is self-distillation: this must be the exact unquantized BF16 model
  # from which model.pretrained_model_name_or_path was quantized. The launcher
  # supplies and validates the concrete path.
  teacher_model_name_or_path: /path/to/bf16-model-matching-student

  # Flash samples only its four deployed transformer-evaluation timesteps.
  # Set schedule=qwen_image for full-range logit-normal/uniform QAD instead.
  timestep:
    schedule: qwen_image_flash
    # For an original Qwen-Image student, a contiguous slice of its official
    # inference trajectory can instead be sampled uniformly. Example for the
    # first 5 of 50 denoising steps at 1024x1024:
    # num_inference_steps: 50
    # inference_step_start: 0
    # inference_step_end: 5
    # image_seq_len: 4096

  # Optional calibrated quantized attention. The launcher supplies the recipe
  # and the student-specific calibration artifact when explicitly enabled.
  attention_grill:
    enabled: false
    recipe_path: null
    calibration_path: null
    ignore:
      - transformer_blocks.0.attn
      - transformer_blocks.1.attn
      - transformer_blocks.58.attn
      - transformer_blocks.59.attn
    expected_replaced: 56
    expected_ignored: 4

  # Final-output MSE remains an independent weight-1 objective component.
  output_loss:
    type: mse
    weight: 1.0

  # Independent additive coefficient for the ordinary flow-matching target.
  task_loss:
    weight: 0.0

  # Match every transformer block that contains an enabled student weight
  # quantizer. The 56 selected Qwen blocks are averaged as one loss group.
  layerwise:
    enabled: true
    selection: quantized_blocks
    # Cosine is scale-stable for BF16-teacher versus quantized-student block
    # outputs. Weight 3 makes this group slightly dominant.
    type: cosine
    weight: 3.0
    reduction: mean
    streams:
      - selector: encoder_hidden_states
        weight: 0.2
      - selector: hidden_states
        weight: 0.8
    log_per_block: false

  student:
    mode: nvfp4
    train_scope: all

optim:
  learning_rate: 2.0e-6
  optimizer:
    weight_decay: 0.01
    betas: [0.9, 0.999]

lr_scheduler:
  lr_decay_style: constant
  lr_warmup_steps: 0
  min_lr: 2.0e-6

fsdp:
  tp_size: 1
  cp_size: 1
  pp_size: 1
  dp_replicate_size: 1
  dp_size: 1
  activation_checkpointing: true

flow_matching:
  adapter_type: qwen_image
  timestep_sampling: logit_normal
  logit_mean: 0.0
  logit_std: 1.0
  flow_shift: 3.0
  mix_uniform_ratio: 0.0
  use_sigma_noise: true
  sigma_min: 0.0
  sigma_max: 1.0
  num_train_timesteps: 1000
  cfg_dropout_prob: 0.0
  use_loss_weighting: true
  loss_weighting_scheme: linear
  adapter_kwargs:
    guidance_scale: 3.5
    use_guidance_embeds: false

data:
  dataloader:
    _target_: fastgen_data.build_text_to_image_multiresolution_dataloader
    cache_dir: /path/to/preprocessed/qwen_image_1024p
    base_resolution: [1024, 1024]
    batch_size: 1
    drop_last: false
    shuffle: true
    num_workers: 0

checkpoint:
  enabled: true
  checkpoint_dir: /path/to/output/qwen_image_qad_nvfp4/checkpoints
  model_save_format: safetensors
  # Keep sharded DCP state for resume and also emit a Diffusers-compatible
  # consolidated transformer checkpoint for inference-bundle assembly.
  save_consolidated: true
  diffusers_compatible: true
  restore_from: LATEST
